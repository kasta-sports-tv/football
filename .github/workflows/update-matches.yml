name: Update KickoffTV match data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Запустити оновлення вручну, навіть якщо AUTO_UPDATE вимкнено"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kickofftv-collector
  cancel-in-progress: false

jobs:
  collect:
    # За розкладом запускаємо лише тоді, коли AUTO_UPDATE не вимкнено.
    # Ручний запуск через Run workflow доступний незалежно від цього перемикача.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.AUTO_UPDATE != 'false'

    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run collector
        env:
          KOTV_COOKIES: ${{ secrets.KOTV_COOKIES }}
          TZ: Europe/Kyiv
        run: python collector.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json state/collector-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KickoffTV match data"
            git push
          else
            echo "No changes to commit"
          fi
