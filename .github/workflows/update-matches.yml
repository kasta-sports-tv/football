
name: Update KickoffTV match data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kickofftv-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run collector
        env:
          KOTV_COOKIES: ${{ secrets.KOTV_COOKIES }}
        run: python collector.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json state/collector-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KickoffTV match data"
            git push
          else
            echo "No changes to commit"
          fi
